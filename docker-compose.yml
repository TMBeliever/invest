version: '3.8'

services:
  # 1. Python FastAPI 后端服务 (宿主机 8006 端口 -> 容器 8000 端口)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: investscope-server
    restart: always
    ports:
      - "8006:8000"
    volumes:
      # 持久化挂载 SQLite 数据库到独立的 docker-db 目录，避免覆盖代码
      - ./docker-data/db:/app/docker-db
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - DB_PATH=/app/docker-db/investscope.db
      - JWT_SECRET_KEY=investscope_prod_jwt_secret_key_2026
      - TZ=Asia/Shanghai

  # 2. Next.js 前端服务 (宿主机 3006 端口 -> 容器 3000 端口)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: investscope-web
    restart: always
    ports:
      - "3006:3000"
    environment:
      # 容器间内部通信地址，无需写死宿主机公网 IP 或 localhost
      - INTERNAL_API_URL=http://server:8000
      - TZ=Asia/Shanghai
    depends_on:
      - server
