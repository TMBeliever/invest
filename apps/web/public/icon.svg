<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" filter="url(#glow)" />
  
  <!-- Subtle Top Highlight -->
  <rect x="32" y="32" width="448" height="224" rx="112" fill="url(#lightGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Scope / Targeting Ring (Background Accent) -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.2" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15" />

  <!-- Dynamic Trending Up Arrow -->
  <path d="M128 360 L216 272 L288 320 L384 180" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M296 172 L392 172 L392 268" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Apex Glowing Pulse Dot -->
  <circle cx="388" cy="176" r="16" fill="#38bdf8" />
  <circle cx="388" cy="176" r="8" fill="#ffffff" />
</svg>